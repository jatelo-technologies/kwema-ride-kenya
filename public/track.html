<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live trip — Kwema Ride Kenya</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/brand/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png">
<link rel="apple-touch-icon" href="/brand/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="/styles.css">
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;background:var(--sand)}
  .t-head{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;
    display:flex;align-items:center;gap:12px}
  .t-head img{width:34px;height:34px;border-radius:9px}
  .t-head .b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;color:var(--ink)}
  .t-head .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;
    font-weight:700;color:var(--go)}
  .t-head .live i{width:9px;height:9px;border-radius:50%;background:var(--go);
    animation:pulse 1.6s infinite}
  .t-head .live.off{color:var(--muted)} .t-head .live.off i{background:var(--hint);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,122,76,.5)}70%{box-shadow:0 0 0 9px rgba(30,122,76,0)}100%{box-shadow:0 0 0 0 rgba(30,122,76,0)}}
  .t-body{flex:1;display:grid;grid-template-columns:380px 1fr;min-height:0}
  .t-card{background:#fff;border-right:1px solid var(--line);padding:22px;overflow-y:auto}
  #tmap{width:100%;height:100%;min-height:320px;background:var(--surface)}
  .status{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;
    color:var(--ink);line-height:1.15}
  .sub{color:var(--muted);font-size:14.5px;margin-top:6px}
  .veh{margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:var(--r);
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .plate{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;
    background:var(--mg-50);color:var(--mg-700);padding:6px 11px;border-radius:8px;white-space:nowrap}
  .route{margin-top:20px}
  .route .r{display:flex;gap:12px;padding:8px 0;font-size:15px;color:var(--ink-2)}
  .route .pip{width:11px;height:11px;border-radius:50%;margin-top:5px;flex:none}
  .route .a{background:var(--lk-500)} .route .bb{background:var(--mg-500)}
  .sos{margin-top:22px;padding:14px 16px;border-radius:var(--r);background:#FBEAE8;color:var(--stop);
    font-size:14px;line-height:1.5}
  .sos a{color:var(--stop);font-weight:800}
  .upd{margin-top:16px;font-size:12.5px;color:var(--hint)}
  .gone{max-width:440px;margin:80px auto;text-align:center;padding:0 22px}
  .gone h1{font-size:26px;margin-bottom:10px}
  .gone p{color:var(--muted)}
  @media(max-width:820px){
    .t-body{grid-template-columns:1fr;grid-template-rows:55vh auto}
    #tmap{order:-1;height:55vh}
    .t-card{border-right:none;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="t-head">
  <img src="/brand/icon-180.png" alt="">
  <span class="b">Kwema Ride</span>
  <span class="live off" id="live"><i></i><span id="live-t" data-i18n="track.connecting">Connecting…</span></span>
</div>

<div class="t-body" id="body">
  <div class="t-card">
    <div class="status" id="status">…</div>
    <div class="sub" id="sub"></div>
    <div class="veh" id="veh" hidden>
      <div><div style="font-weight:700;color:var(--ink)" id="driver"></div>
        <div class="sub" style="margin-top:2px" id="vdesc"></div></div>
      <div class="plate" id="plate"></div>
    </div>
    <div class="route">
      <div class="r"><span class="pip a"></span><span id="from"></span></div>
      <div class="r"><span class="pip bb"></span><span id="to"></span></div>
    </div>
    <div class="sos"><span data-i18n="track.sos">If you think they are in danger, call them first. If you cannot reach them, call</span>
      <a id="emg" href="tel:999">999</a>.</div>
    <div class="upd" id="upd"></div>
  </div>
  <div id="tmap"></div>
</div>

<div class="gone" id="gone" hidden>
  <h1 data-i18n="track.gone.t">This trip link has ended</h1>
  <p data-i18n="track.gone.p">Shared trip links stop working an hour after the trip ends. Ask the person for a new link if they are still travelling.</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/i18n.js"></script>
<script src="/track.js"></script>
</body>
</html>
